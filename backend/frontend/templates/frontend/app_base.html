{% extends "frontend/base.html" %}
{% block body %}
<div class="shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="/dashboard/"><span class="brand-mark">AE</span>AEC Admissions</a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">Abroad Education Counselling &amp; Application Management · Sprint 1</div>
  </aside>
  <div>
    <header class="topbar">
      <button class="btn btn-outline btn-sm menu-toggle" id="menu-toggle" aria-label="Toggle navigation">Menu</button>
      <div class="muted small" id="crumb">{% block crumb %}{% endblock %}</div>
      <div class="who" id="who"></div>
    </header>
    <main class="content" id="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
